name = "tips-chat"
main = "worker.js"
compatibility_date = "2026-07-31"
compatibility_flags = ["nodejs_compat"]

[vars]
# 사이트 주소만 호출을 허용한다. 로컬에서 테스트할 주소도 함께 적어 둔다.
# (비워 두면 아무 도메인에서나 호출할 수 있다 — 배포 후에는 채워 두는 편이 좋다.)
ALLOWED_ORIGINS = "https://hamyunguu.github.io,http://localhost:5179,http://127.0.0.1:5179"

# 모델을 바꾸고 싶으면 여기만 고치면 된다.
# 짧은 한국어 상담의 품질과 응답 비용 균형을 위해 Sonnet을 기본으로 쓴다.
MODEL = "claude-sonnet-5"

# API 키는 여기에 적지 않는다. 아래 명령으로 시크릿에 저장한다:
#   npx wrangler secret put ANTHROPIC_API_KEY

# 공개 채팅의 API 비용 폭주를 막는 기본 제한. 같은 네트워크에서 분당 20회까지 허용한다.
[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "20260903"

  [ratelimits.simple]
  limit = 20
  period = 60
