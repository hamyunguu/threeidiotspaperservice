<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- chat send button: three process inks overlapping on a black disc.
       Overlaps are painted explicitly (circle clipped by circle) instead of
       blended, so they render identically in every browser. -->
  <defs>
    <clipPath id="sb-blue"><circle cx="79" cy="114" r="42"/></clipPath>
    <clipPath id="sb-yellow"><circle cx="121" cy="114" r="42"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="100" fill="#000000"/>

  <!-- the three inks -->
  <circle cx="100" cy="78"  r="42" fill="#e8628c"/>
  <circle cx="79"  cy="114" r="42" fill="#4090f0"/>
  <circle cx="121" cy="114" r="42" fill="#fadf4e"/>

  <!-- pairwise overlaps -->
  <g clip-path="url(#sb-blue)"><circle cx="100" cy="78" r="42" fill="#0e3a79"/></g>
  <g clip-path="url(#sb-yellow)"><circle cx="100" cy="78" r="42" fill="#e8642c"/></g>
  <g clip-path="url(#sb-yellow)"><circle cx="79" cy="114" r="42" fill="#3d8a32"/></g>

  <!-- all three -->
  <g clip-path="url(#sb-blue)">
    <g clip-path="url(#sb-yellow)"><circle cx="100" cy="78" r="42" fill="#16300e"/></g>
  </g>
</svg>
