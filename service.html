<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="cache-control" content="no-cache" />
<meta http-equiv="expires" content="0" />
<title>TiPS — service</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=59" />

<!-- The sheet preview is a live 3D model. order.js only pulls three.js in
     once, on this page; the import map is what lets its add-ons resolve the
     bare "three" specifier they import internally. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body class="order page-sub">

<div class="viewport" id="viewport">
  <div class="stage" id="stage">

    <!-- ===== header — the hero's, with this page already named (Figma 428:114) ===== -->
    <span class="hd-t" id="hdLetter" aria-label="TiPS"><img alt="" /><img alt="" /></span>
    <img class="hd-mark" src="assets/fig-logo-mark.svg?v=59" alt="TiPS" data-href="index.html" />

    <div class="hd-menu" id="hdMenu">
      <span class="hd-menu-label">MENU</span>
      <nav class="hd-nav">
        <a href="identity.html">Identity</a>
        <a href="program.html">Program</a>
        <a class="is-current" href="service.html">Service</a>
      </nav>
    </div>

    <button type="button" class="hd-search" id="hdSearch">Search</button>
    <a class="hd-cart" href="cart.html">Cart(0)</a>
    <a class="hd-login" href="login.html">Login</a>

    <div class="hd-field" id="hdField">
      <span class="hd-caret" aria-hidden="true"></span>
      <input class="hd-input" id="hdInput" type="text" autocomplete="off" placeholder="무엇을 찾고 계신가요?" />
      <span class="hd-underline" aria-hidden="true"></span>
      <button type="button" class="hd-close" id="hdClose" aria-label="검색 닫기">
        <img src="assets/fig-search-icon.svg?v=59" alt="" />
      </button>
    </div>

    <div class="h-rule" aria-hidden="true"></div>

    <!-- ===== product tabs — one order flow each ===== -->
    <nav class="ord-tabs" id="ordTabs">
      <button type="button" class="ord-tab is-on" data-mode="poster">Poster</button>
      <button type="button" class="ord-tab" data-mode="book">Book</button>
      <button type="button" class="ord-tab" data-mode="leaflet">Leaflet</button>
      <button type="button" class="ord-tab" data-mode="print">Print</button>
    </nav>

    <!-- the dashed rule splits the order form from the preview -->
    <div class="ord-split" aria-hidden="true"></div>

    <!-- ===== left: order form — order.js renders it from the mode schema ===== -->
    <form class="ord-form" id="ordForm" autocomplete="off"></form>

    <!-- ===== right: live 3D preview ===== -->
    <div class="ord-preview" id="ordPreview">
      <div class="ord-stage" id="ordStage">
        <p class="ord-stage-note" id="ordStageNote">3D 미리보기를 불러오는 중…</p>
      </div>
      <p class="ord-drop-hint" id="ordDropHint">1번에서 파일을 올리거나 여기에 끌어다 놓으면 바로 3D에 반영됩니다</p>
      <p class="ord-dim" id="ordDim"></p>
      <button type="button" class="ord-view-reset" id="ordViewReset">시점 초기화</button>
    </div>

  </div>
</div>

<script src="header.js?v=59"></script>
<script src="script.js?v=59"></script>
<script type="module" src="order.js?v=59"></script>
<script src="cursor.js?v=59"></script>
</body>
</html>
