<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="cache-control" content="no-cache" />
<meta http-equiv="expires" content="0" />
<title>TiPS — service</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@300;350;400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=75" />

<!-- The sheet preview is a live 3D model. order.js only pulls three.js in
     once, on this page; the import map is what lets its add-ons resolve the
     bare "three" specifier they import internally. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body class="order page-sub">

<div class="viewport" id="viewport">
  <div class="stage" id="stage">

    <!-- ===== header — the hero's, with this page already named (Figma 428:114) ===== -->
    <span class="hd-t" id="hdLetter" aria-label="TiPS"><img alt="" /><img alt="" /></span>
    <img class="hd-mark" src="assets/fig-logo-mark.svg?v=75" alt="TiPS" data-href="index.html" />

    <div class="hd-menu" id="hdMenu">
      <span class="hd-menu-label">MENU</span>
      <nav class="hd-nav">
        <a href="identity.html">Identity</a>
        <a href="program.html">Program</a>
        <a class="is-current" href="service.html">Service</a>
      </nav>
    </div>

    <button type="button" class="hd-search" id="hdSearch">Search</button>
    <a class="hd-cart" href="cart.html">Cart(0)</a>
    <a class="hd-login" href="login.html">Login</a>

    <div class="hd-field" id="hdField">
      <span class="hd-caret" aria-hidden="true"></span>
      <input class="hd-input" id="hdInput" type="text" autocomplete="off" placeholder="무엇을 찾고 계신가요?" />
      <span class="hd-underline" aria-hidden="true"></span>
      <button type="button" class="hd-close" id="hdClose" aria-label="검색 닫기">
        <img src="assets/fig-search-icon.svg?v=75" alt="" />
      </button>
    </div>

    <div class="h-rule" aria-hidden="true"></div>

    <!-- the vertical rule splits the two independent left panes from preview -->
    <div class="ord-split" aria-hidden="true"></div>

    <!-- ===== left-top: common information; only its right-hand form scrolls ===== -->
    <section class="ord-common-pane" id="ordCommonPane">
      <aside class="ord-product-side">
        <nav class="ord-tabs" id="ordTabs" aria-label="제품 종류">
          <button type="button" class="ord-tab is-on" data-mode="poster">
            <i aria-hidden="true"></i><span>포스터<small>Poster</small></span>
          </button>
          <button type="button" class="ord-tab" data-mode="book">
            <i aria-hidden="true"></i><span>책<small>Book</small></span>
          </button>
          <button type="button" class="ord-tab" data-mode="product">
            <i aria-hidden="true"></i><span>제품<small>Products</small></span>
          </button>
        </nav>
        <div class="ord-product-kinds" id="ordProductKinds" aria-label="제품 세부 종류">
          <button type="button" data-kind="소책자">소책자</button>
          <button type="button" data-kind="리플렛">리플렛</button>
          <button type="button" class="is-on" data-kind="명함">명함</button>
        </div>
        <p class="ord-service-note">서비스 정보를 작성한 후<br>문의하시면 확인되는 대로<br>견적, 일정을 이메일<br>답장으로 보내드리고<br>있습니다. 인쇄를 맡기기<br>전에 확인 사항 및 가이드 등<br>웹사이트의 모든 항목을 꼭<br>읽어주시기 바랍니다.</p>
      </aside>
      <div class="ord-common-scroll" id="ordCommon" tabindex="0"></div>
    </section>

    <!-- ===== left-bottom: detailed information; independently scrollable ===== -->
    <section class="ord-detail-pane" id="ordDetailPane" tabindex="-1">
      <div class="ord-detail-title" id="ordDetailTitle"></div>
      <form class="ord-form" id="ordForm" autocomplete="off"></form>
    </section>

    <!-- ===== right: live 3D preview ===== -->
    <div class="ord-preview" id="ordPreview">
      <img class="ord-crop is-left-top" src="assets/order-crop-top-left.svg?v=75" alt="" aria-hidden="true" />
      <img class="ord-crop is-right-top" src="assets/order-crop-top-right.svg?v=75" alt="" aria-hidden="true" />
      <img class="ord-crop is-left-bottom" src="assets/order-crop-bottom-left.svg?v=75" alt="" aria-hidden="true" />
      <img class="ord-crop is-right-bottom" src="assets/order-crop-bottom-right.svg?v=75" alt="" aria-hidden="true" />
      <p class="ord-preview-summary" id="ordPreviewSummary">“업로드 파일 이름", 설정 크기, 단면/양면, 인쇄 기본 정보 등</p>
      <div class="ord-stage" id="ordStage">
        <p class="ord-stage-note" id="ordStageNote">3D 미리보기를 불러오는 중…</p>
      </div>
      <p class="ord-drop-hint" id="ordDropHint">1번에서 파일을 올리거나 여기에 끌어다 놓으면 바로 3D에 반영됩니다</p>
      <p class="ord-dim" id="ordDim"></p>
      <div class="ord-book-nav" id="ordBookNav" aria-label="내지 페이지 이동">
        <button type="button" data-book-turn="-1" aria-label="이전 내지">←</button>
        <span id="ordBookPage">1 / 1</span>
        <button type="button" data-book-turn="1" aria-label="다음 내지">→</button>
      </div>
      <button type="button" class="ord-view-reset" id="ordViewReset">시점 초기화</button>
    </div>

  </div>
</div>

<script src="header.js?v=75"></script>
<script src="script.js?v=75"></script>
<script type="module" src="order.js?v=75"></script>
<script src="cursor.js?v=75"></script>
</body>
</html>
