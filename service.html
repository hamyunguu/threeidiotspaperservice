<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TiPS — service</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=40" />

<!-- The sheet preview is a live 3D model. order.js only pulls three.js in
     once, on this page; the import map is what lets its add-ons resolve the
     bare "three" specifier they import internally. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body class="order">

<div class="viewport" id="viewport">
  <div class="stage" id="stage">

    <!-- ===== header — same as the hero page ===== -->
    <img class="logo" src="assets/logo.svg?v=40" alt="TiPS 홈으로" data-href="index.html" title="홈" />
    <nav class="nav">
      <a class="nav-item" style="left:304px; top:20px; --nav:#029bed" href="identity.html">Identity</a>
      <a class="nav-item" style="left:304px; top:56px; --nav:#ed028c" href="program.html">Program</a>
      <a class="nav-item is-current" style="left:304px; top:92px; --nav:#302929" href="service.html">Service</a>
      <a class="nav-item" style="left:970px;  top:20px">Search</a>
      <a class="nav-item" style="left:1580px; top:20px">Cart</a>
      <a class="nav-item" style="left:1780px; top:20px">Login</a>
    </nav>
    <div class="header-rule"></div>

    <!-- ===== product tabs — one order flow each ===== -->
    <nav class="ord-tabs" id="ordTabs">
      <button type="button" class="ord-tab is-on" data-mode="poster">Poster</button>
      <button type="button" class="ord-tab" data-mode="book">Book</button>
      <button type="button" class="ord-tab" data-mode="leaflet">Leaflet</button>
      <button type="button" class="ord-tab" data-mode="print">Print</button>
    </nav>

    <!-- the dashed rule splits the order form from the preview -->
    <div class="ord-split" aria-hidden="true"></div>

    <!-- ===== left: order form — order.js renders it from the mode schema ===== -->
    <form class="ord-form" id="ordForm" autocomplete="off"></form>

    <!-- ===== right: live 3D preview ===== -->
    <div class="ord-preview" id="ordPreview">
      <div class="ord-stage" id="ordStage">
        <p class="ord-stage-note" id="ordStageNote">3D 미리보기를 불러오는 중…</p>
      </div>
      <p class="ord-drop-hint" id="ordDropHint">1번에서 파일을 올리거나 여기에 끌어다 놓으면 바로 3D에 반영됩니다</p>
      <p class="ord-dim" id="ordDim"></p>
      <button type="button" class="ord-view-reset" id="ordViewReset">시점 초기화</button>
    </div>

  </div>
</div>

<script src="script.js?v=40"></script>
<script type="module" src="order.js?v=40"></script>
<script src="cursor.js?v=40"></script>
</body>
</html>
