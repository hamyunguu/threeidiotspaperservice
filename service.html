<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TiPS — service</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@300;400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=21" />
</head>
<body class="hero2 order">

<div class="viewport" id="viewport">
  <div class="stage" id="stage">

    <!-- ===== header — same as the hero page ===== -->
    <img class="logo" src="assets/logo.svg?v=21" alt="TiPS 홈으로" data-href="index.html" title="홈" />
    <nav class="nav">
      <a class="nav-item" style="left:304px; top:20px; --nav:#029bed" href="identity.html">Identity</a>
      <a class="nav-item" style="left:304px; top:56px; --nav:#ed028c" href="program.html">Program</a>
      <a class="nav-item is-current" style="left:304px; top:92px; --nav:#302929" href="service.html">Service</a>
      <a class="nav-item" style="left:970px;  top:20px">Search</a>
      <a class="nav-item" style="left:1580px; top:20px">Cart</a>
      <a class="nav-item" style="left:1780px; top:20px">Login</a>
    </nav>
    <div class="header-rule"></div>

    <!-- ===== product tabs — one order flow each ===== -->
    <nav class="ord-tabs" id="ordTabs">
      <button type="button" class="ord-tab is-on" data-mode="poster">Poster</button>
      <button type="button" class="ord-tab" data-mode="book">Book</button>
      <button type="button" class="ord-tab" data-mode="leaflet">Leaflet</button>
      <button type="button" class="ord-tab" data-mode="print">Print</button>
    </nav>

    <!-- the dashed rule splits the order form from the preview -->
    <div class="ord-split" aria-hidden="true"></div>

    <!-- ===== left: order form — order.js renders it from the mode schema ===== -->
    <form class="ord-form" id="ordForm" autocomplete="off"></form>

    <!-- ===== right: sheet preview ===== -->
    <div class="ord-preview" id="ordPreview">
      <div class="ord-paper-wrap">
        <div class="ord-paper" id="ordPaperView"></div>
      </div>
      <p class="ord-drop-hint" id="ordDropHint">1번에서 파일을 올리거나<br />여기에 끌어다 놓으면 미리보기가 들어갑니다</p>
      <p class="ord-dim" id="ordDim"></p>
    </div>

  </div>
</div>

<script src="script.js?v=21"></script>
<script src="order.js?v=21"></script>
<script src="cursor.js?v=21"></script>
</body>
</html>
