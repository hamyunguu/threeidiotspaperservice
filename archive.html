<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="cache-control" content="no-cache" />
<meta http-equiv="expires" content="0" />
<title>TiPS — archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=90" />
</head>
<body class="archive page-sub">

<div class="viewport" id="viewport">
  <div class="stage" id="stage">

    <!-- ===== header — the hero's, with Program already named ===== -->
    <span class="hd-t" id="hdLetter" aria-label="TiPS"><img alt="" /><img alt="" /></span>
    <img class="hd-mark" src="assets/fig-logo-mark.svg?v=90" alt="TiPS" data-href="index.html" />

    <div class="hd-menu" id="hdMenu">
      <span class="hd-menu-label">MENU</span>
      <nav class="hd-nav">
        <a href="identity.html">Identity</a>
        <a class="is-current" href="program.html">Program</a>
        <a href="service.html">Service</a>
      </nav>
    </div>

    <button type="button" class="hd-search" id="hdSearch">Search</button>
    <a class="hd-cart" href="cart.html">Cart(0)</a>
    <a class="hd-login" href="login.html">Login</a>

    <div class="hd-field" id="hdField">
      <span class="hd-caret" aria-hidden="true"></span>
      <input class="hd-input" id="hdInput" type="text" autocomplete="off" placeholder="무엇을 찾고 계신가요?" />
      <span class="hd-underline" aria-hidden="true"></span>
      <button type="button" class="hd-close" id="hdClose" aria-label="검색 닫기">
        <img src="assets/fig-search-icon.svg?v=90" alt="" />
      </button>
    </div>

    <div class="h-rule" aria-hidden="true"></div>

    <!-- ===== registration / crop marks =====
         Top marks belong to the page beginning and bottom marks to its end,
         so none of them follows the viewport while the gallery scrolls. -->
    <div class="marks" aria-hidden="true">
      <div class="mark r-top" style="left:20px"><img src="assets/mark-corner.svg?v=90" style="transform:scaleY(-1)"></div>
      <div class="mark r-top" style="left:1852px"><img src="assets/mark-corner.svg?v=90" style="transform:rotate(90deg) scaleY(-1)"></div>
      <div class="mark r-top is-target" style="left:1852px"><img src="assets/mark-target.svg?v=90"></div>
      <div class="mark r-bot" style="left:20px"><img src="assets/mark-corner.svg?v=90"></div>
      <div class="mark r-bot" style="left:1852px"><img src="assets/mark-corner.svg?v=90" style="transform:rotate(-90deg)"></div>
      <div class="mark r-bot is-target" style="left:20px"><img src="assets/mark-target.svg?v=90"></div>
      <div class="mark r-bot is-target" style="left:1852px"><img src="assets/mark-target.svg?v=90"></div>
    </div>

    <button type="button" class="arc-back" id="arcBack" aria-label="프로그램으로 돌아가기">
      <img src="assets/arc-back.svg?v=90" alt="" />
    </button>

    <!-- ===== the session mark, copy and button — archive.js fills these ===== -->
    <div class="arc-blob blob" id="arcBlob"></div>
    <div class="arc-copy" id="arcCopy"></div>
    <button type="button" class="arc-cta" id="arcCta">
      <span>신청하러 가기</span><img src="assets/arc-cta.svg?v=90" alt="" />
    </button>

    <p class="arc-next-label">다른 프로그램</p>
    <button type="button" class="arc-next" id="arcNext" aria-label="다른 프로그램">
      <img src="assets/arc-next.svg?v=90" alt="" />
    </button>

    <!-- ===== the gallery ===== -->
    <div class="arc-grid" id="arcGrid"></div>

  </div>
</div>

<!-- Archive specifications stay on this page. The dialog is outside the
     scaled stage so it remains a small, readable screen overlay everywhere. -->
<div class="arc-modal" id="arcModal" hidden>
  <button type="button" class="arc-modal-shade" id="arcModalShade" aria-label="작품 정보 닫기"></button>
  <section class="arc-modal-panel" role="dialog" aria-modal="true" aria-labelledby="arcModalTitle" aria-describedby="arcModalNotice">
    <button type="button" class="arc-modal-close" id="arcModalClose" aria-label="작품 정보 닫기">×</button>
    <div class="arc-modal-visual">
      <img id="arcModalImage" alt="" />
      <span class="arc-modal-index" id="arcModalIndex"></span>
    </div>
    <div class="arc-modal-info">
      <p class="arc-modal-session" id="arcModalSession"></p>
      <h2 id="arcModalTitle"></h2>
      <dl class="arc-specs" id="arcModalSpecs"></dl>
      <p class="arc-modal-notice" id="arcModalNotice">사진을 바탕으로 판독한 참고 사양입니다. 정확한 종이명·평량·가공 방식은 제작 전 실물 확인이 필요합니다.</p>
      <div class="arc-modal-nav">
        <button type="button" id="arcModalPrev" aria-label="이전 작품">←</button>
        <span id="arcModalCount"></span>
        <button type="button" id="arcModalNext" aria-label="다음 작품">→</button>
      </div>
    </div>
  </section>
</div>

<script src="header.js?v=90"></script>
<script src="archive.js?v=90"></script>
<script src="script.js?v=90"></script>
<script src="cursor.js?v=90"></script>
</body>
</html>
