<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="cache-control" content="no-cache" />
<meta http-equiv="expires" content="0" />
<title>TiPS — archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=64" />
</head>
<body class="archive page-sub">

<div class="viewport" id="viewport">
  <div class="stage" id="stage">

    <!-- ===== header — the hero's, with Program already named ===== -->
    <span class="hd-t" id="hdLetter" aria-label="TiPS"><img alt="" /><img alt="" /></span>
    <img class="hd-mark" src="assets/fig-logo-mark.svg?v=64" alt="TiPS" data-href="index.html" />

    <div class="hd-menu" id="hdMenu">
      <span class="hd-menu-label">MENU</span>
      <nav class="hd-nav">
        <a href="identity.html">Identity</a>
        <a class="is-current" href="program.html">Program</a>
        <a href="service.html">Service</a>
      </nav>
    </div>

    <button type="button" class="hd-search" id="hdSearch">Search</button>
    <a class="hd-cart" href="cart.html">Cart(0)</a>
    <a class="hd-login" href="login.html">Login</a>

    <div class="hd-field" id="hdField">
      <span class="hd-caret" aria-hidden="true"></span>
      <input class="hd-input" id="hdInput" type="text" autocomplete="off" placeholder="무엇을 찾고 계신가요?" />
      <span class="hd-underline" aria-hidden="true"></span>
      <button type="button" class="hd-close" id="hdClose" aria-label="검색 닫기">
        <img src="assets/fig-search-icon.svg?v=64" alt="" />
      </button>
    </div>

    <div class="h-rule" aria-hidden="true"></div>

    <!-- ===== registration / crop marks =====
         Four corner marks, but only three targets: Figma leaves the top-left
         target out because the back arrow sits in that corner, and the two
         of them stacked read as a smudge. The corner itself stays. -->
    <div class="marks" aria-hidden="true">
      <div class="mark r-top" style="left:20px"><img src="assets/mark-corner.svg?v=64" style="transform:scaleY(-1)"></div>
      <div class="mark r-top" style="left:1852px"><img src="assets/mark-corner.svg?v=64" style="transform:rotate(90deg) scaleY(-1)"></div>
      <div class="mark r-top is-target" style="left:1852px"><img src="assets/mark-target.svg?v=64"></div>
      <div class="mark r-bot" style="left:20px"><img src="assets/mark-corner.svg?v=64"></div>
      <div class="mark r-bot" style="left:1852px"><img src="assets/mark-corner.svg?v=64" style="transform:rotate(-90deg)"></div>
      <div class="mark r-bot is-target" style="left:20px"><img src="assets/mark-target.svg?v=64"></div>
      <div class="mark r-bot is-target" style="left:1852px"><img src="assets/mark-target.svg?v=64"></div>
    </div>

    <!-- ===== back to the programme list ===== -->
    <button type="button" class="arc-back" id="arcBack" aria-label="프로그램으로 돌아가기">
      <img src="assets/arc-back.svg?v=64" alt="" />
    </button>

    <!-- ===== the session mark, copy and button — archive.js fills these ===== -->
    <div class="arc-blob blob" id="arcBlob"></div>
    <div class="arc-copy" id="arcCopy"></div>
    <button type="button" class="arc-cta" id="arcCta">
      <span>신청하러 가기</span><img src="assets/arc-cta.svg?v=64" alt="" />
    </button>

    <p class="arc-next-label">다른 프로그램</p>
    <button type="button" class="arc-next" id="arcNext" aria-label="다른 프로그램">
      <img src="assets/arc-next.svg?v=64" alt="" />
    </button>

    <!-- ===== the gallery ===== -->
    <div class="arc-grid" id="arcGrid"></div>

  </div>
</div>

<script src="header.js?v=64"></script>
<script src="archive.js?v=64"></script>
<script src="script.js?v=64"></script>
<script src="cursor.js?v=64"></script>
</body>
</html>
