<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="cache-control" content="no-cache" />
<meta http-equiv="expires" content="0" />
<title>TiPS — login</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=58" />
</head>
<body class="login page-sub">

<div class="viewport" id="viewport">
  <div class="stage" id="stage">

    <!-- ===== header — the site's own, not the opened one Figma drew ===== -->
    <span class="hd-t" id="hdLetter" aria-label="TiPS"><img alt="" /><img alt="" /></span>
    <img class="hd-mark" src="assets/fig-logo-mark.svg?v=58" alt="TiPS" data-href="index.html" />

    <div class="hd-menu" id="hdMenu">
      <span class="hd-menu-label">MENU</span>
      <nav class="hd-nav">
        <a href="identity.html">Identity</a>
        <a href="program.html">Program</a>
        <a href="service.html">Service</a>
      </nav>
    </div>

    <button type="button" class="hd-search" id="hdSearch">Search</button>
    <a class="hd-cart" href="cart.html">Cart(0)</a>
    <a class="hd-login" href="login.html">Login</a>

    <div class="hd-field" id="hdField">
      <span class="hd-caret" aria-hidden="true"></span>
      <input class="hd-input" id="hdInput" type="text" autocomplete="off" placeholder="무엇을 찾고 계신가요?" />
      <span class="hd-underline" aria-hidden="true"></span>
      <button type="button" class="hd-close" id="hdClose" aria-label="검색 닫기">
        <img src="assets/fig-search-icon.svg?v=58" alt="" />
      </button>
    </div>

    <div class="h-rule" aria-hidden="true"></div>

    <!-- ===== registration / crop marks ===== -->
    <div class="marks" aria-hidden="true">
      <div class="mark r-top" style="left:20px"><img src="assets/mark-corner.svg?v=58" style="transform:scaleY(-1)"></div>
      <div class="mark r-top" style="left:1852px"><img src="assets/mark-corner.svg?v=58" style="transform:rotate(90deg) scaleY(-1)"></div>
      <div class="mark r-top is-target" style="left:20px"><img src="assets/mark-target.svg?v=58"></div>
      <div class="mark r-top is-target" style="left:1852px"><img src="assets/mark-target.svg?v=58"></div>
      <div class="mark r-bot" style="left:20px"><img src="assets/mark-corner.svg?v=58"></div>
      <div class="mark r-bot" style="left:1852px"><img src="assets/mark-corner.svg?v=58" style="transform:rotate(-90deg)"></div>
      <div class="mark r-bot is-target" style="left:20px"><img src="assets/mark-target.svg?v=58"></div>
      <div class="mark r-bot is-target" style="left:1852px"><img src="assets/mark-target.svg?v=58"></div>
    </div>

    <!-- ===== THREE idiots PAPER SERVICE ===== -->
    <img class="lg-lockup" src="assets/tips-lockup.png?v=58" alt="THREE idiots PAPER SERVICE" />

    <!-- ===== the form =====
         Nothing is wired to a server: this is the page as drawn, so the
         form submits nowhere and the buttons below it have no destination
         yet. -->
    <form class="lg-form" id="lgForm" autocomplete="off">
      <label class="lg-label" for="lgId" style="top:343px">이메일 / 아이디</label>
      <!-- the address Figma shows in this box is a sample, not a placeholder:
           the field starts empty -->
      <input class="lg-field" id="lgId" name="id" type="email" style="top:327px" />

      <label class="lg-label" for="lgPw" style="top:422px">비밀번호</label>
      <input class="lg-field" id="lgPw" name="pw" type="password" style="top:405px" />

      <button type="submit" class="lg-btn is-fill" style="left:1145px; top:485px; height:60px">로그인</button>
      <button type="button" class="lg-btn is-fill" style="left:1244px; top:485px; height:60px">회원가입</button>

      <button type="button" class="lg-btn" style="left:1144px; top:565px; height:60px">아이디 찾기</button>
      <button type="button" class="lg-btn" style="left:1286px; top:565px; height:60px">비밀번호 찾기</button>

      <button type="button" class="lg-btn" style="left:1145px; top:755px; width:194px; height:62px">
        <img src="assets/naver.svg?v=58" alt="" />네이버로 로그인
      </button>
      <button type="button" class="lg-btn" style="left:1359px; top:755px; width:194px; height:62px">
        <img src="assets/kakao.svg?v=58" alt="" />카카오로 로그인
      </button>
    </form>

  </div>
</div>

<script src="header.js?v=58"></script>
<script src="login.js?v=58"></script>
<script src="script.js?v=58"></script>
<script src="cursor.js?v=58"></script>
</body>
</html>
